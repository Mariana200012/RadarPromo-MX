name: Automatización RadarPromo-MX

on:
  schedule:
    - cron: '*/45 * * * *' # Se ejecuta cada 45 minutos automáticamente
  workflow_dispatch: # Botón para ejecutar manualmente

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del código
        uses: actions/checkout@v3

      - name: Configurar Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Ejecutar Bot
        env:
          TELEGRAM_API_ID: ${{ secrets.TELEGRAM_API_ID }}
          TELEGRAM_API_HASH: ${{ secrets.TELEGRAM_API_HASH }}
          TELEGRAM_SESSION: ${{ secrets.TELEGRAM_SESSION }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          WHATSAPP_CHANNEL_URL: ${{ secrets.WHATSAPP_CHANNEL_URL }}
          GREEN_API_INSTANCE: ${{ secrets.GREEN_API_INSTANCE }} # <-- Asegúrate de que esta línea exista
          GREEN_API_TOKEN: ${{ secrets.GREEN_API_TOKEN }}       # <-- Asegúrate de que esta línea exista
        run: python bot.py

      - name: Guardar Historial (DB)
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add radar_promo.db
          git commit -m "Actualizar DB de ofertas [skip ci]" || echo "Sin cambios"
          git push
